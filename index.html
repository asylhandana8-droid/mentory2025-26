<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masonry Gallery</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="cover">
      <section class="intro" aria-label="Информация о галерее">
        <span class="badge">FREE</span>
        <h1>Masonry Grid Layout</h1>
        <ul class="intro__list">
          <li>Scalable layout using Auto Layout</li>
          <li>Componentized for ease of use</li>
          <li>Replace the images to suit your needs</li>
        </ul>
      </section>

      <section class="gallery-zone" aria-label="Галерея изображений">
        <div class="tilt-wrap">
          <div class="masonry" id="masonryGallery"></div>
        </div>
      </section>
    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <script defer src="./script.js"></script>
  </body>
</html>
